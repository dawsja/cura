# =============================================================================
# One-time move from Postgres to SQLite, for installs set up before Cura
# switched to SQLite. Start once with this file added:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres-import.yml up -d
#
# On that start the app copies the Postgres database into /data/cura.db and
# verifies the copy. Afterwards, start without this file:
#
#   docker compose up -d --remove-orphans
#
# The Postgres volume is left in place as a fallback. See "Upgrading from
# Postgres" in README.md.
# =============================================================================
services:
  db:
    image: postgres:16.5-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cura}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cura} -d ${POSTGRES_DB:-cura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cura}

volumes:
  db_data:
