name: curamoney

services:
  db:
    image: postgres:16.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cura}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cura} -d ${POSTGRES_DB:-cura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  app:
    image: ghcr.io/dawsja/cura-money:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-UTC}
      # Leave APP_URL / BETTER_AUTH_URL / OIDC_REDIRECT_BASE empty for IP-only
      # access (the app derives origins from the request's Host header). Set
       # them when you put a stable HTTPS domain in front. The configured
       # scheme controls whether authentication cookies are Secure.
      APP_URL: ${APP_URL:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      OIDC_REDIRECT_BASE: ${OIDC_REDIRECT_BASE:-}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-auto}

      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-false}

      DATABASE_URL: postgresql://${POSTGRES_USER:-cura}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cura}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}

      RUN_CRON: ${RUN_CRON:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      MCP_ENABLED: ${MCP_ENABLED:-true}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://localhost:'+(process.env.PORT || 3000)+'/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
