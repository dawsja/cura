name: curamoney

services:
  app:
    image: ghcr.io/dawsja/cura:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-UTC}
      # Leave APP_URL / BETTER_AUTH_URL / OIDC_REDIRECT_BASE empty for IP-only
      # access (the app derives origins from the request's Host header). Set
       # them when you put a stable HTTPS domain in front. The configured
       # scheme controls whether authentication cookies are Secure.
      APP_URL: ${APP_URL:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      OIDC_REDIRECT_BASE: ${OIDC_REDIRECT_BASE:-}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-auto}

      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-false}

      # The SQLite database lives on the cura_data volume.
      DATABASE_PATH: /data/cura.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}

      RUN_CRON: ${RUN_CRON:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      MCP_ENABLED: ${MCP_ENABLED:-true}
    volumes:
      - cura_data:/data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://localhost:'+(process.env.PORT || 3000)+'/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  cura_data:
